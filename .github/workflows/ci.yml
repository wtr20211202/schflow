name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: windows-latest, node: 20 }
          - { os: windows-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Test (unit + golden property scenarios, no LLM)
        run: npm test
      - name: Typecheck placeholder
        run: npm run typecheck --if-present

  # macOS 单独作业串行（max-parallel:1）——实测本账号每轮只供给一台 macOS 机器：
  # 并行双腿时第二条永远拿不到 runner（runner_name 空、零步骤、~15min 被取消，
  # 三轮两标签组合复现）；串行让第二条排队等第一条完成，不再空转。
  macos:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: [20, 22]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Test (unit + golden property scenarios, no LLM)
        run: npm test
      - name: Typecheck placeholder
        run: npm run typecheck --if-present
