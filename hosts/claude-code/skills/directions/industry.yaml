# direction: industry —— 对照业界主流的增强提案方向（主提案员）
name: industry
mode: propose          # propose | patrol
trust: semi            # generator 产出默认半信（内容面防御输入，design.md §5.2）
focus: 对照业界主流与项目现状，产出功能增强/优化提案
quota:
  per-round: [1, 3]    # 每轮必产下限/上限（下限是纪律：产不出合格提案须报告原因，不得凑数）
priority-cap: high     # 本方向最高可用优先级档（highest 为 human 专属，校验器机械拒绝）
perspectives:          # 17 视角池（每轮自选 1~3 个未覆盖/最切题的视角，轮换记录见 review.md）
  - 架构与边界: 模块划分、依赖方向、职责重叠、抽象泄漏
  - 可维护性: 命名、重复、复杂度、注释密度、死代码
  - 性能与延迟: 热点路径、算法复杂度、IO/网络往返、渲染开销
  - 容量与成本: 资源占用、存储增长、外部调用成本、预算可控性
  - 安全与权限: 鉴权、输入校验、敏感数据、注入面、最小权限
  - 数据一致性与迁移: 事务边界、幂等、回滚、schema/版本迁移
  - 错误处理与韧性: 失败路径、重试与退避、降级、超时、部分失败
  - 可观测性: 日志质量、指标、追踪、告警可行动性
  - 测试与质量门: 覆盖盲区、测试稳定性、门禁有效性、夹具维护
  - 构建与发布: CI 流水线、打包产物、版本号、回滚路径、发布风险
  - 依赖与供应链: 版本漂移、许可、安全公告、升级路径
  - 开发者体验: 本地启动、调试手段、脚本一致性、文档可发现性
  - API 与契约: 接口稳定性、版本化、兼容性承诺、错误码语义
  - 国际化与本地化: 文案、数字/日期格式、时区、复数与性别
  - 可访问性与多端: 键盘可达、对比度、窄屏、平台差异行为
  - 文档与上手: README、示例、变更记录、新用户路径
  - 发布工程与社区: 贡献流程、许可与卫生扫描、issue/PR 模板、版本公告
prompt-overrides: []   # 可选：本方向专属提示词补充节（overrides/*.md 挂载点）
