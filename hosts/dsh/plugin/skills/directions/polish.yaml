# direction: polish —— 打磨巡查方向（现有功能走查转提案，只提不做）
name: polish
mode: patrol            # patrol：实机走查、只产提案不实施
trust: semi
focus: 已落地功能的实机走查（可用性/一致性/回归迹象），发现转提案
quota:
  per-round: [0, 2]     # 走查无发现时 0 条合法（下限 0），有发现最多 2 条
priority-default: high
perspectives:           # 走查视角池（patrol 自选，按最近改动面优先）
  - 交互一致性: 同类操作在不同入口的行为/文案/快捷键是否一致
  - 空态与边界: 空数据、首用、极限输入、中断恢复的实际表现
  - 文案与提示: 错误信息可行动性、术语统一、误导性措辞
  - 回归迹象: 近期改动面附近的异常日志、失败重试、性能体感退化
  - 可发现性: 功能入口、帮助、默认值是否让人找得到用得上
  - 平台差异: 同一功能在 win/mac/linux 或窄屏/宽屏下的行为差异
prompt-overrides: []
